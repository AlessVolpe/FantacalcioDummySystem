name: Python quality checks

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Install locked development environment
        run: uv sync --locked --python 3.13
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Strict type checking
        run: uv run --locked mypy
      - name: Regression tests and branch coverage
        run: uv run --locked pytest --cov --cov-report=term-missing
      - name: Download verified PostgreSQL 19 Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Public SHA-256 checksum of the EDB 19.0-1 archive.
          POSTGRES_ARCHIVE_SHA256: 'BC397F1E58F018E364262074C2E9D960F6169E7436892DBE6E73313D1BB201FF' # pragma: allowlist secret
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'fds-pg.zip'
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-19.0-1-windows-x64-binaries.zip'
          $expected = $env:POSTGRES_ARCHIVE_SHA256
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $expected) {
            throw 'PostgreSQL binary archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'fds-pg')
          Remove-Item -LiteralPath $archive
      - name: Provision disposable PostgreSQL 19
        run: uv run --locked python -m scripts.ci_postgres start
      - name: PostgreSQL integration tests and migrations
        run: uv run --locked pytest -m integration --ds=fantacalciodummysystem.config.settings.testing
      - name: Stop disposable PostgreSQL
        if: always()
        run: uv run --locked python -m scripts.ci_postgres stop
