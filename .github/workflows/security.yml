name: Dependency security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Export locked runtime and development dependencies
        run: >-
          uv export --locked --all-groups --no-emit-project --no-hashes
          --format requirements-txt --output-file audit-requirements.txt
      - name: Audit pinned dependencies for known vulnerabilities
        run: >-
          uvx --python 3.13 pip-audit==2.10.1
          --strict --no-deps --disable-pip -r audit-requirements.txt
