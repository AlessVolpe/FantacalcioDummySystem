name: Bug report
description: Report a reproducible defect in Fantacalcio Dummy System.
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use [private reporting](https://github.com/AlessVolpe/FantacalcioDummySystem/security/advisories/new).
        Do not include credentials or private competition data.
  - type: textarea
    id: problem
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example or sanitized input if applicable.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the FDS revision, OS, Python version and CRD version if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Sanitized logs, screenshots or relevant experiment settings.
