[project]
name = "fantacalciodummysystem"
version = "0.1.1"
description = "Counterfactual analysis and reproducible simulation of Fantacalcio competitions."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Volpe", email = "37452470+AlessVolpe@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pre-commit>=4.2,<5",
    "django-stubs[compatible-mypy]>=6.1.2,<6.2",
    "pytest-django>=4.13,<5",
]

[project.urls]
Homepage = "https://github.com/AlessVolpe/FantacalcioDummySystem"
Repository = "https://github.com/AlessVolpe/FantacalcioDummySystem"
Issues = "https://github.com/AlessVolpe/FantacalcioDummySystem/issues"

[project.scripts]
fantacalciodummysystem = "fantacalciodummysystem:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = ["src", "scripts", "tests", "manage.py"]
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.django-stubs]
django_settings_module = "fantacalciodummysystem.config.settings.testing"

[tool.pytest.ini_options]
minversion = "8.3"
DJANGO_SETTINGS_MODULE = "fantacalciodummysystem.config.settings.testing"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["fantacalciodummysystem"]

[tool.coverage.report]
show_missing = true
skip_covered = false
