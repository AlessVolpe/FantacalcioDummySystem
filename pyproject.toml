[project]
name = "fantacalciodummysystem"
version = "0.1.0"
description = "Counterfactual analysis and reproducible simulation of Fantacalcio competitions."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Volpe", email = "37452470+AlessVolpe@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/AlessVolpe/FantacalcioDummySystem"
Repository = "https://github.com/AlessVolpe/FantacalcioDummySystem"
Issues = "https://github.com/AlessVolpe/FantacalcioDummySystem/issues"

[project.scripts]
fantacalciodummysystem = "fantacalciodummysystem:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
