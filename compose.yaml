# Local PostgreSQL only. Python runs on the host.
services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set the private bootstrap role}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - postgres_admin_password
    ports:
      - "127.0.0.1:${FDS_POSTGRES_PORT:?Set the private local port}:5432"
    volumes:
      - postgres19-data:/var/lib/postgresql

secrets:
  postgres_admin_password:
    file: ./secrets/postgres-admin-password

volumes:
  postgres19-data:
